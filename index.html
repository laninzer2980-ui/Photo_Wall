<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Наше путешествие любви</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="readme_img/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="readme_img/favicon//favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="readme_img/favicon//favicon-16x16.png">
    <link rel="manifest" href="readme_img/favicon//site.webmanifest">
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <nav>
        <div class="container">
            <h1>Наше путешествие любви</h1>
        </div>
    </nav>

    <main>
        <section id="name">
            <h2>Анастасия&Константин</h2> <!--**Name**-->
        </section>

        <section id="timer">
            <audio id="bgm" src="music/music1.mp3" controls style="width: 100%; max-width: 300px; display: block; margin: 0 auto;"></audio>
            <p>Мы любим друг друга уже</p>
            <h2><span id="loveDays">0</span> Дней</h2>
        </section>

        <section id="dates">
            <div class="date-item">
                <p>22.11.2011</p> <!--**Birthday**-->
                <span>Моя днюха</span>
            </div>
            <div class="date-item">
                <p>25.08.2012</p> <!--**Birthday**-->
                <span>Твоя днюха</span>
            </div>
            <div class="date-item">
                <p>12.11.2024</p> <!--**Love date**-->
                <span>Годовщина</span>
            </div>
        </section>

        <section id="gallery">
        </section>
    </main>

    <div id="popup">
        <span id="closeBtn">&times;</span>
        <p id="imgDate"></p>
        <img id="popupImg" src="" alt="Large Image">
    </div>

    <div id="leftArrow" class="arrow">❮</div>
    <div id="rightArrow" class="arrow">❯</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
    <script src="script.js"></script>
    <script src="hearts.js"></script>
</body>
</html>
